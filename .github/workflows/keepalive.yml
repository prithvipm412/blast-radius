name: Keepalive

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --max-time 90 https://blast-radius-api-nawe.onrender.com/api/health
      - name: Ping stats endpoint
        run: curl -fsS --retry 3 --max-time 90 https://blast-radius-api-nawe.onrender.com/api/stats
