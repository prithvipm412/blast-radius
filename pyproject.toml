[project]
name = "blast-radius"
version = "0.1.0"
description = "On-call agent with a company brain, backed by FalkorDB. Graph Hacks hackathon entry."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "falkordb>=1.0",
    "python-dotenv>=1.0",
    "google-genai>=0.3",
    "groq>=0.11",
    "httpx>=0.27",
    "PyGithub>=2.3",
    "pydantic>=2.8",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["agent", "api", "graph", "ingest"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
